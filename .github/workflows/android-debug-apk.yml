name: Android debug APK

# Manual run (Actions tab > Run workflow) or any push to a branch named android-*
on:
  workflow_dispatch:
  push:
    branches: [ "android-*" ]

# Only the latest push matters: a newer run cancels the one in progress
concurrency:
  group: android-debug-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Build debug APK
      run: |
        cd android/build-scripts/tuxguitar-android
        chmod +x gradlew
        ./gradlew :apk:assembleDebug
    # A single prerelease, replaced on every build, keeps only the latest APK at a fixed URL:
    # https://github.com/<owner>/<repo>/releases/download/android-latest/tuxguitar-debug.apk
    - name: Publish APK as the android-latest release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp android/build-scripts/tuxguitar-android/apk/build/outputs/apk/debug/*.apk tuxguitar-debug.apk
        gh release delete android-latest --cleanup-tag --yes || true
        gh release create android-latest tuxguitar-debug.apk \
          --prerelease \
          --target "$GITHUB_SHA" \
          --title "Android debug APK (latest)" \
          --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Replaced on every build."
